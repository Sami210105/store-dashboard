services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ratings
      POSTGRES_PASSWORD: ratings_local
      POSTGRES_DB: ratings
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ratings -d ratings']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - ratings_data:/var/lib/postgresql/data
volumes:
  ratings_data:
